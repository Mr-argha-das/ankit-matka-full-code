{% extends "base.html" %}
{% block content %}
<div class="toolbar"><button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#leaveModal">Apply Leave</button></div>
<table class="table table-striped data-table" data-api="/api/leaves" data-columns="employee_id,leave_type,start_date,end_date,status">
  <thead><tr><th>Employee</th><th>Type</th><th>Start</th><th>End</th><th>Status</th></tr></thead>
</table>
<div class="modal fade" id="leaveModal" tabindex="-1"><div class="modal-dialog"><form class="modal-content ajax-form" data-api="/api/leaves"><div class="modal-header"><h2 class="modal-title fs-5">Leave</h2></div><div class="modal-body">
  <input class="form-control mb-2" name="employee_id" placeholder="Employee ID" required>
  <select class="form-select mb-2" name="leave_type"><option value="casual">Casual</option><option value="sick">Sick</option><option value="earned">Earned</option><option value="work_from_home">Work From Home</option><option value="half_day">Half Day</option></select>
  <input class="form-control mb-2" name="start_date" type="date" required>
  <input class="form-control mb-2" name="end_date" type="date" required>
  <textarea class="form-control" name="reason" placeholder="Reason"></textarea>
</div><div class="modal-footer"><button class="btn btn-primary">Save</button></div></form></div></div>
{% endblock %}
