{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <span class="eyebrow">Kiosk Setup</span>
    <h2>Branches & TL phones</h2>
    <p>Create each office branch and assign the kiosk PIN used by the Flutter app.</p>
  </div>
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#branchModal">Add Branch Kiosk</button>
</div>
<div id="branchMap" class="map-panel"></div>
<table class="table table-striped data-table mt-3" data-api="/api/branches" data-columns="branch_name,branch_code,address,latitude,longitude,allowed_radius,kiosk_pin">
  <thead><tr><th>Branch</th><th>Code</th><th>Address</th><th>Latitude</th><th>Longitude</th><th>Radius</th><th>Kiosk PIN</th></tr></thead>
</table>
<div class="modal fade" id="branchModal" tabindex="-1"><div class="modal-dialog modal-lg"><form class="modal-content ajax-form" data-api="/api/branches"><div class="modal-header"><h2 class="modal-title fs-5">Branch Kiosk</h2></div><div class="modal-body row g-2">
  <input type="hidden" name="tenant_id">
  <div class="col-12"><label class="form-label">Company</label><select class="form-select option-loader company-select" name="company_id" data-source="/api/companies" data-kind="company"><option value="">Use current company</option></select></div>
  <div class="col-md-6"><label class="form-label">Branch Name</label><input class="form-control" name="branch_name" placeholder="Head Office" required></div>
  <div class="col-md-6"><label class="form-label">Branch Code</label><input class="form-control" name="branch_code" placeholder="HQ" required></div>
  <div class="col-12"><label class="form-label">Address</label><input class="form-control" name="address" placeholder="Office address" required></div>
  <div class="col-md-6"><label class="form-label">Latitude</label><input class="form-control" name="latitude" type="number" step="any" placeholder="19.0760" required></div>
  <div class="col-md-6"><label class="form-label">Longitude</label><input class="form-control" name="longitude" type="number" step="any" placeholder="72.8777" required></div>
  <div class="col-md-6"><label class="form-label">Allowed Radius</label><input class="form-control" name="allowed_radius" type="number" value="100" placeholder="Meters"></div>
  <div class="col-md-6"><label class="form-label">Kiosk PIN</label><input class="form-control" name="kiosk_pin" value="1234" placeholder="1234"></div>
</div><div class="modal-footer"><button class="btn btn-primary">Save</button></div></form></div></div>
{% endblock %}
{% block scripts %}<script>renderBranchMap();</script>{% endblock %}
