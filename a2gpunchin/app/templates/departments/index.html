{% extends "base.html" %}
{% block content %}
<div class="toolbar"><button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#departmentModal">Add Department</button></div>
<table class="table table-striped data-table" data-api="/api/departments" data-columns="department_name,department_code,description">
  <thead><tr><th>Name</th><th>Code</th><th>Description</th></tr></thead>
</table>
<div class="modal fade" id="departmentModal" tabindex="-1"><div class="modal-dialog"><form class="modal-content ajax-form" data-api="/api/departments"><div class="modal-header"><h2 class="modal-title fs-5">Department</h2></div><div class="modal-body">
  <input class="form-control mb-2" name="department_name" placeholder="Department name" required>
  <input class="form-control mb-2" name="department_code" placeholder="Code" required>
  <textarea class="form-control" name="description" placeholder="Description"></textarea>
</div><div class="modal-footer"><button class="btn btn-primary">Save</button></div></form></div></div>
{% endblock %}
