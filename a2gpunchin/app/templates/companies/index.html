{% extends "base.html" %}
{% block content %}
<div class="toolbar"><button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#companyModal">Add Company</button></div>
<table class="table table-striped data-table" data-api="/api/companies" data-columns="company_name,company_code,email,subscription_plan,status">
  <thead><tr><th>Name</th><th>Code</th><th>Email</th><th>Plan</th><th>Status</th></tr></thead>
</table>
<div class="modal fade" id="companyModal" tabindex="-1"><div class="modal-dialog"><form class="modal-content ajax-form" data-api="/api/companies"><div class="modal-header"><h2 class="modal-title fs-5">Company</h2></div><div class="modal-body">
  <input class="form-control mb-2" name="company_name" placeholder="Company name" required>
  <input class="form-control mb-2" name="company_code" placeholder="Code" required>
  <input class="form-control mb-2" name="email" type="email" placeholder="Email" required>
  <input class="form-control mb-2" name="phone" placeholder="Phone">
  <input class="form-control mb-2" name="address" placeholder="Address">
  <hr>
  <input class="form-control mb-2" name="admin_first_name" placeholder="Admin first name" value="Company">
  <input class="form-control mb-2" name="admin_last_name" placeholder="Admin last name" value="Admin">
  <input class="form-control mb-2" name="admin_email" type="email" placeholder="Admin email">
  <input class="form-control mb-2" name="admin_phone" placeholder="Admin phone">
  <input class="form-control mb-2" name="admin_password" type="password" placeholder="Admin password" value="CompanyAdmin123!">
</div><div class="modal-footer"><button class="btn btn-primary">Save</button></div></form></div></div>
{% endblock %}
