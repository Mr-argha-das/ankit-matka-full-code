<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Market Charts | NATRAJ777</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Rajdhani", sans-serif; }
    .brand { font-family: "Teko", sans-serif; }
    .loader { border: 3px solid #dbeafe; border-top-color: #2563eb; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen bg-[#f5f9ff] text-slate-900">
  <nav class="sticky top-0 z-50 border-b border-blue-200 bg-white/95 shadow-sm backdrop-blur-xl">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
      <a href="index.html" class="flex items-center gap-3">
        <span class="brand flex h-11 w-11 items-center justify-center rounded-full bg-blue-600 text-xl font-bold text-white shadow-md">N7</span>
        <span>
          <strong class="brand block text-2xl leading-none text-blue-700">NATRAJ777</strong>
          <small class="font-bold tracking-widest text-blue-400">LIVE CHARTS</small>
        </span>
      </a>
      <div class="flex items-center gap-2">
        <a href="https://game.natraj777.com/" class="rounded-full bg-emerald-500 px-4 py-2 text-sm font-bold text-white transition hover:bg-emerald-600">▶ Play Now</a>
        <a href="index.html" class="rounded-full border border-blue-200 px-4 py-2 text-sm font-bold text-blue-700 transition hover:bg-blue-50">Home</a>
      </div>
    </div>
  </nav>

  <main class="mx-auto max-w-6xl px-4 py-10">
    <div class="mb-8 text-center">
      <p class="text-xs font-bold uppercase tracking-[.3em] text-blue-500">Backend-powered results</p>
      <h1 id="page-title" class="brand mt-2 text-4xl font-bold uppercase text-slate-900 md:text-6xl">Live Market Charts</h1>
      <p id="page-subtitle" class="mt-2 text-slate-500">Select a market to view its latest chart.</p>
    </div>

    <div id="loading" class="flex items-center justify-center gap-3 py-16 text-blue-700">
      <span class="loader h-8 w-8 rounded-full"></span>
      <span class="font-semibold">Loading live data...</span>
    </div>

    <div id="error" class="hidden rounded-2xl border border-red-200 bg-red-50 p-6 text-center">
      <p class="font-bold text-red-700">Data load nahi ho saka.</p>
      <p id="error-message" class="mt-1 text-sm text-red-500"></p>
      <button onclick="loadPage()" class="mt-4 rounded-full bg-blue-600 px-5 py-2 text-sm font-bold text-white">Retry</button>
    </div>

    <section id="market-section" class="hidden">
      <div id="market-grid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    </section>

    <section id="chart-section" class="hidden">
      <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
        <a href="charts.html" class="rounded-full border border-blue-200 bg-white px-4 py-2 text-sm font-bold text-blue-700 shadow-sm">← All Markets</a>
        <span id="result-count" class="rounded-full bg-blue-100 px-4 py-2 text-xs font-bold uppercase tracking-wider text-blue-700"></span>
      </div>
      <div id="chart-grid" class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3"></div>
    </section>
  </main>

  <script>
    const API_BASE = ["localhost", "127.0.0.1"].includes(window.location.hostname)
      ? "http://127.0.0.1:8000"
      : "https://api.natraj777.com";

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[char]);
    }

    function marketId(market) {
      return market.id || market._id?.$oid || market._id || "";
    }

    function isOpen(market) {
      return market.status === true || market.status === "Market Running";
    }

    function showError(error) {
      document.getElementById("loading").classList.add("hidden");
      document.getElementById("error-message").textContent = error.message || "Unknown error";
      document.getElementById("error").classList.remove("hidden");
    }

    function renderMarkets(markets) {
      const grid = document.getElementById("market-grid");
      const active = markets.filter(market => market.is_active !== false);
      grid.innerHTML = active.map(market => {
        const id = encodeURIComponent(marketId(market));
        const open = isOpen(market);
        return `
          <a href="charts.html?id=${id}" class="group rounded-2xl border border-blue-200 bg-white p-5 shadow-sm transition hover:-translate-y-1 hover:border-blue-400 hover:shadow-xl">
            <div class="flex items-start justify-between gap-3">
              <div>
                <h2 class="brand text-2xl font-bold uppercase text-slate-800">${escapeHtml(market.name || "Market")}</h2>
                <p class="mt-1 text-xs font-semibold text-slate-400">${escapeHtml(market.open_time || "--:--")} – ${escapeHtml(market.close_time || "--:--")}</p>
              </div>
              <span class="rounded-full px-3 py-1 text-xs font-bold ${open ? "bg-emerald-100 text-emerald-700" : "bg-red-100 text-red-600"}">${open ? "Running" : "Closed"}</span>
            </div>
            <div class="mt-5 flex items-center justify-between border-t border-blue-100 pt-4 font-bold text-blue-600">
              <span>View Live Chart</span><span class="transition group-hover:translate-x-1">→</span>
            </div>
          </a>`;
      }).join("") || '<p class="col-span-full py-12 text-center text-slate-400">No active markets found.</p>';
      document.getElementById("market-section").classList.remove("hidden");
    }

    function renderChart(data) {
      document.title = `${data.market_name || "Market"} Chart | NATRAJ777`;
      document.getElementById("page-title").textContent = `${data.market_name || "Market"} Chart`;
      document.getElementById("page-subtitle").textContent = "Latest results directly from the backend.";
      document.getElementById("result-count").textContent = `${data.chart_count || 0} Results`;
      document.getElementById("chart-grid").innerHTML = (data.chart || []).map(row => {
        const jodi = `${row.open_digit && row.open_digit !== "-" ? row.open_digit : "*"}${row.close_digit && row.close_digit !== "-" ? row.close_digit : "*"}`;
        return `
          <article class="overflow-hidden rounded-2xl border border-blue-200 bg-white shadow-sm">
            <div class="flex items-center justify-between bg-gradient-to-r from-blue-700 to-blue-500 px-4 py-3 text-white">
              <strong>${escapeHtml(row.day || "")}</strong>
              <time class="text-xs font-semibold text-blue-100">${escapeHtml(row.date || "")}</time>
            </div>
            <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-3 p-5 text-center">
              <div><small class="block text-[10px] font-bold uppercase tracking-wider text-slate-400">Open Panna</small><strong class="mt-1 block text-xl text-slate-700">${escapeHtml(row.open_panna || "***")}</strong></div>
              <strong class="brand rounded-xl bg-blue-50 px-4 py-2 text-3xl text-blue-700">${escapeHtml(jodi)}</strong>
              <div><small class="block text-[10px] font-bold uppercase tracking-wider text-slate-400">Close Panna</small><strong class="mt-1 block text-xl text-slate-700">${escapeHtml(row.close_panna || "***")}</strong></div>
            </div>
          </article>`;
      }).join("") || '<p class="col-span-full py-12 text-center text-slate-400">Is market ke results abhi available nahi hain.</p>';
      document.getElementById("chart-section").classList.remove("hidden");
    }

    async function loadPage() {
      document.getElementById("loading").classList.remove("hidden");
      document.getElementById("error").classList.add("hidden");
      document.getElementById("market-section").classList.add("hidden");
      document.getElementById("chart-section").classList.add("hidden");
      try {
        const id = new URLSearchParams(window.location.search).get("id");
        const endpoint = id
          ? `${API_BASE}/market/chart/monthly/${encodeURIComponent(id)}`
          : `${API_BASE}/market/`;
        const response = await fetch(endpoint);
        if (!response.ok) throw new Error(`API error ${response.status}`);
        const data = await response.json();
        if (id) renderChart(data);
        else renderMarkets(data.markets || data.data || []);
        document.getElementById("loading").classList.add("hidden");
      } catch (error) {
        showError(error);
      }
    }

    loadPage();
  </script>
</body>
</html>
